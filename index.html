<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Канон: 50 главных книг жизни</title>
  <style>
    :root[data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-hover: #1c2742;
      --border: #26334d;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --warning: #f59e0b;
      --badge-bg: #1e293b;
    }
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.1);
      --success: #059669;
      --warning: #d97706;
      --badge-bg: #f1f5f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px 16px; }
    header {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 16px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .title-group h1 { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
    .title-group p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button, select, input {
      font: inherit; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 12px; font-size: 0.875rem; outline: none;
    }
    button { cursor: pointer; font-weight: 600; }
    button.active-view { border-color: var(--accent); background: var(--accent-glow); color: var(--accent); }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px; margin-bottom: 20px;
    }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
    .stat-label { font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
    .stat-value { font-size: 1.6rem; font-weight: 800; margin-top: 4px; }
    .stat-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .progress-bar-wrap { width: 100%; height: 8px; background: var(--badge-bg); border-radius: 999px; overflow: hidden; margin-top: 10px; }
    .progress-bar-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s ease; }
    .filters-bar {
      display: grid; grid-template-columns: 1.5fr repeat(3, 1fr);
      gap: 10px; margin-bottom: 20px; background: var(--surface);
      padding: 14px; border-radius: 14px; border: 1px solid var(--border);
    }
    @media (max-width: 900px) { .filters-bar { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 540px) { .filters-bar { grid-template-columns: 1fr; } }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .book-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px;
    }
    .book-card.status-done { border-left: 4px solid var(--success); }
    .book-card.status-reading { border-left: 4px solid var(--warning); }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--badge-bg); color: var(--text-muted); }
    .badge-rot { background: var(--accent-glow); color: var(--accent); border: 1px solid var(--accent); }
    .book-title { font-size: 1.15rem; font-weight: 800; margin-top: 6px; }
    .book-author { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
    .book-idea { font-size: 0.88rem; background: var(--badge-bg); padding: 10px 12px; border-radius: 10px; border-left: 3px solid var(--accent); }
    .meta-box { font-size: 0.82rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; }
    .meta-box strong { color: var(--text); }
    .card-controls { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .control-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .status-select { flex: 1; font-weight: 700; min-width: 130px; }
    .status-select.val-done { color: var(--success); border-color: var(--success); }
    .status-select.val-reading { color: var(--warning); border-color: var(--warning); }
    .litres-link {
      text-decoration: none; font-size: 0.78rem; font-weight: 700; padding: 7px 11px;
      border-radius: 8px; background: #ff5500; color: #fff; white-space: nowrap; display: inline-block;
    }
    .note-input {
      width: 100%; resize: vertical; min-height: 48px; font-size: 0.82rem;
      padding: 8px 10px; border-radius: 8px; background: var(--bg);
      color: var(--text); border: 1px solid var(--border);
    }
    .stars { display: inline-flex; gap: 2px; cursor: pointer; user-select: none; }
    .star { font-size: 1.2rem; color: var(--border); }
    .star.active { color: #fbbf24; }
    .table-wrap { width: 100%; overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 1100px; font-size: 0.84rem; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--badge-bg); color: var(--text-muted); font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }
    tr.row-done td { border-left: 3px solid var(--success); }
    tr.row-reading td { border-left: 3px solid var(--warning); }
    #errorBox { display: none; background: #7f1d1d; color: #fecaca; padding: 14px; border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <div id="errorBox"></div>
    <header>
      <div class="title-group">
        <h1>Канон: 50 главных книг жизни</h1>
        <p>Интерактивная таблица и навигатор чтения • ЛитРес Гид • Автосохранение</p>
      </div>
      <div class="top-actions">
        <button type="button" id="viewCardsBtn" class="active-view" onclick="setView('cards')">🗂 Карточки</button>
        <button type="button" id="viewTableBtn" onclick="setView('table')">📊 Таблица</button>
        <button type="button" onclick="toggleTheme()">☀️ / 🌙 Тема</button>
        <button type="button" onclick="exportBackup()">💾 Бэкап (.json)</button>
        <button type="button" onclick="document.getElementById('importFile').click()">📂 Загрузить</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Прогресс канона</div>
        <div class="stat-value" id="statRead">0 / 50</div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="statBar"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Сейчас читаю</div>
        <div class="stat-value" id="statReading">0</div>
        <div class="stat-sub" id="statNextBook">Следующая: #1 по ротации</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Освоено времени</div>
        <div class="stat-value" id="statHours">0 / 710 ч</div>
        <div class="stat-sub">При среднем темпе 45 мин/день</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Средняя оценка</div>
        <div class="stat-value" id="statRating">— ★</div>
        <div class="stat-sub">По прочитанным книгам</div>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="🔍 Поиск по названию, автору, чтецу или идее..." oninput="renderBooks()">
      <select id="catFilter" onchange="renderBooks()">
        <option value="all">Все смысловые блоки (7)</option>
        <option value="I. Античность и Ренессанс">I. Античность и Ренессанс</option>
        <option value="II. Русская классика">II. Русская классика</option>
        <option value="III. Мировая классика XIX в.">III. Мировая классика XIX в.</option>
        <option value="IV. XX век: экзистенциализм и модернизм">IV. XX век: экзистенциализм и модернизм</option>
        <option value="V. Постмодерн и магический реализм">V. Постмодерн и магический реализм</option>
        <option value="VI. Антиутопии и фантастика">VI. Антиутопии и фантастика</option>
        <option value="VII. Фундаментальный нон-фикшн">VII. Фундаментальный нон-фикшн</option>
      </select>
      <select id="statusFilter" onchange="renderBooks()">
        <option value="all">Все статусы</option>
        <option value="Не начато">⏳ Не начато</option>
        <option value="Читаю">📖 Читаю сейчас</option>
        <option value="Прочитано">✅ Прочитано</option>
      </select>
      <select id="sortFilter" onchange="renderBooks()">
        <option value="rotation">Сортировка: Очередь ротации (1–50)</option>
        <option value="canon">Сортировка: № в историческом каноне</option>
        <option value="hoursAsc">По времени чтения (сначала короткие)</option>
        <option value="diffAsc">По сложности (от 1 к 5)</option>
      </select>
    </div>

    <div id="mainView">Загрузка списка книг...</div>
  </div>

      {canon:25, rot:50, cat:"IV. XX век: экзистенциализм и модернизм", author:"Джеймс Джойс", title:"Улисс (или Дублинцы)", year:"1922", diff:5, hours:25, trans:"пер. В. А. Хинкиса и С. С. Хоружего (с комм.)", litres:"Текст: Азбука-Классика | Аудио: В. Максимов", idea:"Поток сознания и одиссея одного обычного дня"}
    ];

    var STORAGE_KEY = "sergey_canon50_state_v1";
    var userState = {};
    var currentView = "cards";

    function safeGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSet(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    try {
      var raw = safeGet(STORAGE_KEY);
      if (raw) userState = JSON.parse(raw);
      var savedView = safeGet("sergey_canon50_view");
      if (savedView) currentView = savedView;
      var savedTheme = safeGet("sergey_canon50_theme");
      if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
    } catch (e) {
      userState = {};
    }

    function saveState() {
      safeSet(STORAGE_KEY, JSON.stringify(userState));
      updateStats();
    }

    function getBookState(canonId) {
      if (!userState[canonId]) {
        userState[canonId] = { status: "Не начато", rating: 0, note: "" };
      }
      return userState[canonId];
    }

    function setView(v) {
      currentView = v;
      safeSet("sergey_canon50_view", v);
      document.getElementById("viewCardsBtn").className = (v === "cards") ? "active-view" : "";
      document.getElementById("viewTableBtn").className = (v === "table") ? "active-view" : "";
      renderBooks();
    }

    function setStatus(canonId, val) {
      getBookState(canonId).status = val;
      saveState();
      renderBooks();
    }

    function setRating(canonId, stars) {
      var st = getBookState(canonId);
      st.rating = (st.rating === stars) ? 0 : stars;
      saveState();
      renderBooks();
    }

    function setNote(canonId, text) {
      getBookState(canonId).note = text;
      saveState();
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function updateStats() {
      var readCount = 0, readingCount = 0, readHours = 0, totalHours = 0;
      var ratedSum = 0, ratedCount = 0;
      var nextBook = null;

      var sortedByRot = BOOKS.slice().sort(function(a, b) { return a.rot - b.rot; });
      for (var i = 0; i < sortedByRot.length; i++) {
        var b = sortedByRot[i];
        totalHours += b.hours;
        var st = getBookState(b.canon);
        if (st.status === "Прочитано") {
          readCount++;
          readHours += b.hours;
        } else if (st.status === "Читаю") {
          readingCount++;
        } else if (!nextBook) {
          nextBook = b;
        }
        if (st.rating > 0) {
          ratedSum += st.rating;
          ratedCount++;
        }
      }

      document.getElementById("statRead").innerText = readCount + " / 50";
      document.getElementById("statBar").style.width = ((readCount / 50) * 100) + "%";
      document.getElementById("statReading").innerText = String(readingCount);
      document.getElementById("statNextBook").innerText = nextBook
        ? ("Следующая (#" + nextBook.rot + "): " + nextBook.title)
        : "Весь канон прочитан!";
      document.getElementById("statHours").innerText = readHours + " / " + totalHours + " ч";
      document.getElementById("statRating").innerText = ratedCount > 0
        ? ((ratedSum / ratedCount).toFixed(1) + " ★")
        : "— ★";
    }

    function renderBooks() {
      var q = document.getElementById("searchInput").value.toLowerCase().trim();
      var cat = document.getElementById("catFilter").value;
      var stFilter = document.getElementById("statusFilter").value;
      var sort = document.getElementById("sortFilter").value;

      var list = [];
      for (var i = 0; i < BOOKS.length; i++) {
        var b = BOOKS[i];
        var st = getBookState(b.canon);
        if (cat !== "all" && b.cat !== cat) continue;
        if (stFilter !== "all" && st.status !== stFilter) continue;
        if (q) {
          var hay = (b.title + " " + b.author + " " + b.idea + " " + b.trans + " " + b.litres + " " + st.note).toLowerCase();
          if (hay.indexOf(q) === -1) continue;
        }
        list.push(b);
      }

      list.sort(function(a, b) {
        if (sort === "rotation") return a.rot - b.rot;
        if (sort === "canon") return a.canon - b.canon;
        if (sort === "hoursAsc") return a.hours - b.hours;
        if (sort === "diffAsc") return a.diff - b.diff;
        return 0;
      });

      var host = document.getElementById("mainView");
      var html = "";

      if (currentView === "table") {
        html += '<div class="table-wrap"><table><thead><tr>';
        html += '<th>Ротация</th><th>Канон</th><th>Блок</th><th>Автор и Название</th>';
        html += '<th>Сложн.</th><th>Время</th><th>Перевод / Редакция</th><th>Что брать на ЛитРес</th>';
        html += '<th>Ключевая идея</th><th>Статус и Оценка</th><th>Мои заметки</th>';
        html += '</tr></thead><tbody>';

        for (var j = 0; j < list.length; j++) {
          var bk = list[j];
          var stT = getBookState(bk.canon);
          var rowCls = stT.status === "Прочитано" ? "row-done" : (stT.status === "Читаю" ? "row-reading" : "");
          var selCls = stT.status === "Прочитано" ? "val-done" : (stT.status === "Читаю" ? "val-reading" : "");
          var litresUrl = "https://www.litres.ru/search/?q=" + encodeURIComponent(bk.author + " " + bk.title);
          var starsHtml = "";
          for (var s = 1; s <= 5; s++) {
            starsHtml += '<span class="star ' + (s <= stT.rating ? 'active' : '') + '" onclick="setRating(' + bk.canon + ',' + s + ')">★</span>';
          }
          html += '<tr class="' + rowCls + '">';
          html += '<td><span class="badge badge-rot">#' + bk.rot + '</span></td>';
          html += '<td>#' + bk.canon + '</td>';
          html += '<td>' + escapeHtml(bk.cat) + '</td>';
          html += '<td><strong>' + escapeHtml(bk.title) + '</strong> (' + escapeHtml(bk.year) + ')<br><span style="color:var(--accent)">' + escapeHtml(bk.author) + '</span></td>';
          html += '<td>' + bk.diff + '/5</td>';
          html += '<td>' + bk.hours + ' ч</td>';
          html += '<td>' + escapeHtml(bk.trans) + '</td>';
          html += '<td>' + escapeHtml(bk.litres) + '<br><a class="litres-link" style="margin-top:6px" href="' + litresUrl + '" target="_blank" rel="noopener">ЛитРес ↗</a></td>';
          html += '<td>' + escapeHtml(bk.idea) + '</td>';
          html += '<td><select class="status-select ' + selCls + '" onchange="setStatus(' + bk.canon + ', this.value)">';
          html += '<option value="Не начато"' + (stT.status === "Не начато" ? " selected" : "") + '>⏳ Не начато</option>';
          html += '<option value="Читаю"' + (stT.status === "Читаю" ? " selected" : "") + '>📖 Читаю</option>';
          html += '<option value="Прочитано"' + (stT.status === "Прочитано" ? " selected" : "") + '>✅ Прочитано</option>';
          html += '</select><div class="stars" style="margin-top:6px">' + starsHtml + '</div></td>';
          html += '<td><textarea class="note-input" style="min-width:180px" placeholder="Заметки..." oninput="setNote(' + bk.canon + ', this.value)">' + escapeHtml(stT.note) + '</textarea></td>';
          html += '</tr>';
        }
        html += '</tbody></table></div>';
      } else {
        html += '<div class="cards-grid">';
        for (var k = 0; k < list.length; k++) {
          var bc = list[k];
          var stC = getBookState(bc.canon);
          var cardClass = stC.status === "Прочитано" ? "status-done" : (stC.status === "Читаю" ? "status-reading" : "");
          var selClass = stC.status === "Прочитано" ? "val-done" : (stC.status === "Читаю" ? "val-reading" : "");
          var lUrl = "https://www.litres.ru/search/?q=" + encodeURIComponent(bc.author + " " + bc.title);
          var stHtml = "";
          for (var m = 1; m <= 5; m++) {
            stHtml += '<span class="star ' + (m <= stC.rating ? 'active' : '') + '" onclick="setRating(' + bc.canon + ',' + m + ')">★</span>';
          }
          html += '<div class="book-card ' + cardClass + '">';
          html += '<div><div class="badges">';
          html += '<span class="badge badge-rot">Ротация #' + bc.rot + '</span>';
          html += '<span class="badge">Канон #' + bc.canon + '</span>';
          html += '<span class="badge">Сложность: ' + bc.diff + '/5</span>';
          html += '<span class="badge">⏱ ' + bc.hours + ' ч</span>';
          html += '</div>';
          html += '<div class="book-title">' + escapeHtml(bc.title) + ' <span style="font-weight:400;font-size:0.85rem;color:var(--text-muted)">(' + escapeHtml(bc.year) + ')</span></div>';
          html += '<div class="book-author">' + escapeHtml(bc.author) + ' • <span style="color:var(--text-muted);font-weight:500">' + escapeHtml(bc.cat) + '</span></div></div>';
          html += '<div class="book-idea">' + escapeHtml(bc.idea) + '</div>';
          html += '<div class="meta-box"><div><strong>Эталонный перевод / ред.:</strong> ' + escapeHtml(bc.trans) + '</div>';
          html += '<div><strong>Что брать на ЛитРес:</strong> ' + escapeHtml(bc.litres) + '</div></div>';
          html += '<div class="card-controls"><div class="control-row">';
          html += '<select class="status-select ' + selClass + '" onchange="setStatus(' + bc.canon + ', this.value)">';
          html += '<option value="Не начато"' + (stC.status === "Не начато" ? " selected" : "") + '>⏳ Не начато</option>';
          html += '<option value="Читаю"' + (stC.status === "Читаю" ? " selected" : "") + '>📖 Читаю</option>';
          html += '<option value="Прочитано"' + (stC.status === "Прочитано" ? " selected" : "") + '>✅ Прочитано</option>';
          html += '</select>';
          html += '<div class="stars">' + stHtml + '</div>';
          html += '<a class="litres-link" href="' + lUrl + '" target="_blank" rel="noopener">ЛитРес ↗</a>';
          html += '</div>';
          html += '<textarea class="note-input" placeholder="Мои заметки, цитаты и впечатления..." oninput="setNote(' + bc.canon + ', this.value)">' + escapeHtml(stC.note) + '</textarea>';
          html += '</div></div>';
        }
        html += '</div>';
      }

      host.innerHTML = html;
      updateStats();
    }

    function toggleTheme() {
      var root = document.documentElement;
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      safeSet("sergey_canon50_theme", next);
    }

    function exportBackup() {
      var blob = new Blob([JSON.stringify(userState, null, 2)], {type: "application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "canon-50-backup.json";
      a.click();
    }

    function importBackup(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        try {
          userState = JSON.parse(ev.target.result);
          saveState();
          renderBooks();
        } catch (err) {
          alert("Ошибка чтения файла бэкапа");
        }
      };
      reader.readAsText(file);
    }

    setView(currentView);
  </script>
